[project]
name = "agent-memory-dreaming-cadence"
version = "0.1.0"
description = "Does dreaming cadence trade memory freshness against compute? Measured on Memora."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
